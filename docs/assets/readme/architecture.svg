<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-label="Architecture: WordPress → Acorn → app modules → Blade views → Vite assets; content from WooCommerce tour products, page fields, Theme Settings and seeded block layouts; ship via GitHub Releases to Appearance → Update Theme on the buyer site.">
  <style>
    :root { --ink:#0f1c2e; --muted:#5b6b7f; --line:#c5d0de; --box:#ffffff; --tint:#f3f5f8; --navy:#6b521f; --blue:#6b521f; --teal:#9fd8bf; }
    @media (prefers-color-scheme: dark) { :root { --ink:#e6edf3; --muted:#9aa7b8; --line:#30363d; --box:#161b22; --tint:#0d1117; --navy:#e2c27a; --blue:#e2c27a; --teal:#9fd8bf; } }
    .lane { fill: var(--tint); stroke: var(--line); }
    .lanet { font: 700 12px/1 -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; fill: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
    .box { fill: var(--box); stroke: var(--line); stroke-width: 1.2; } .box.hi { stroke: var(--navy); stroke-width: 1.6; }
    .t { font: 700 14px/1 -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; fill: var(--ink); } .s { font: 400 12px/1.3 -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; fill: var(--muted); } .m { font: 600 11px/1 ui-monospace, Menlo, Consolas, monospace; fill: var(--blue); }
    .arrow { stroke: var(--navy); stroke-width: 1.6; fill: none; marker-end: url(#a); } .arrow.teal { stroke: var(--teal); marker-end: url(#at); }
  </style>
